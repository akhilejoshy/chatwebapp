<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Room - Interest: {{ interest }}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .chat-box {
            border: 1px solid #ddd;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background-color: #f8f9fa;
        }
        .message {
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 5px;
            max-width: 70%;
        }
        .sent { background-color: #d1e7dd; align-self: flex-end; }
        .received { background-color: #f8d7da; align-self: flex-start; }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header text-center">
                <h3>Chat Room - Interest: {{ interest }}</h3>
            </div>
            <div class="card-body d-flex flex-column">
                <div id="chat-box" class="chat-box d-flex flex-column"></div>
            </div>
            <div class="card-footer">
                <div class="input-group">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type your message...">
                    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- WebSocket Script -->
    <script>
        let interest = "{{ interest }}";
        let protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        let socket = new WebSocket(protocol + window.location.host + "/ws/chat/" + interest + "/");

        socket.onopen = function() {
            console.log("✅ Connected to WebSocket!");
        };

        socket.onmessage = function(event) {
            let data = JSON.parse(event.data);
            let chatBox = document.getElementById("chat-box");

            if (data.message) {
                let messageElement = `<div class="message received">${data.message}</div>`;
                chatBox.innerHTML += messageElement;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        function sendMessage() {
            let messageInput = document.getElementById("messageInput");
            let message = messageInput.value.trim();
            let chatBox = document.getElementById("chat-box");

            if (message !== "") {
                let messageElement = `<div class="message sent">${message}</div>`;
                chatBox.innerHTML += messageElement;
                chatBox.scrollTop = chatBox.scrollHeight;

                socket.send(JSON.stringify({"message": message}));
                messageInput.value = "";
            }
        }
    </script>
</body>
</html>
